[workspace]
members = [
	"crates/summit-usbgadget-config",
	"crates/summit-usbgadget-usb",
	"crates/summit-usbgadget-socket-update",
	"crates/swupdate-ipc",
	"crates/summit-usbgadget-swupdate",
	"crates/summit-usbgadget-dfu",
	"crates/summit-usbgadget-fastboot-usb",
	"crates/summit-usbgadget-fastboot-proto",
	"crates/summit-usbgadget-fastboot-tcp",
]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Ezurio LLC"]
license = "LicenseRef-Ezurio-Clause"

[workspace.dependencies]
bytes = "1"
crc32fast = "1.5"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
inventory = "0.3"
log = "0.4"
nusb = "0.2"
openssl = "0.10"
openssl-sys = "0.9"
rustix = { version = "1.1.4", features = ["fs", "rand", "system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simple_logger = { version = "5", default-features = false }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-openssl = "0.6"
tokio-udev = "0.10"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
usb-gadget = { version = "1.2", features = ["tokio"] }
summit-usbgadget-config = { path = "crates/summit-usbgadget-config" }
summit-usbgadget-dfu = { path = "crates/summit-usbgadget-dfu" }
summit-usbgadget-fastboot-proto = { path = "crates/summit-usbgadget-fastboot-proto" }
summit-usbgadget-fastboot-tcp = { path = "crates/summit-usbgadget-fastboot-tcp" }
summit-usbgadget-fastboot-usb = { path = "crates/summit-usbgadget-fastboot-usb" }
summit-usbgadget-socket-update = { path = "crates/summit-usbgadget-socket-update", default-features = false }
summit-usbgadget-usb = { path = "crates/summit-usbgadget-usb" }
summit-usbgadget-swupdate = { path = "crates/summit-usbgadget-swupdate" }
swupdate-ipc = { path = "crates/swupdate-ipc", features = ["async"] }

[patch.crates-io]
usb-gadget = { path = "patches/usb-gadget" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_results = "deny"
warnings = "deny"
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[package]
name = "summit-usbgadget"
version.workspace = true
description = "Runtime-configurable update app with pluggable USB gadget and socket transports."
license.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.summit-usbgadget]
public-version = "0.0.0.0"
plugins = [
	{ crate = "summit-usbgadget-usb", feature = "usb" },
	{ crate = "summit-usbgadget-dfu", feature = "dfu" },
	{ crate = "summit-usbgadget-fastboot-usb", feature = "fastboot-usb" },
	{ crate = "summit-usbgadget-socket-update", feature = "socket" },
	{ crate = "summit-usbgadget-fastboot-tcp", feature = "fastboot-tcp" },
]

[lib]
name = "summit_usbgadget"
path = "src/lib.rs"

[[bin]]
name = "summit-usbgadget"
path = "src/main.rs"

[features]
default = ["usb", "dfu", "fastboot-usb"]
usb = ["dep:summit-usbgadget-usb"]
dfu = ["usb", "dep:summit-usbgadget-dfu", "dep:summit-usbgadget-swupdate"]
fastboot-usb = ["usb", "dep:summit-usbgadget-fastboot-usb", "dep:summit-usbgadget-swupdate"]
fastboot-tcp = ["dep:summit-usbgadget-fastboot-tcp", "dep:summit-usbgadget-swupdate"]
socket = ["dep:summit-usbgadget-socket-update", "dep:summit-usbgadget-swupdate"]
socket-tls = ["socket", "summit-usbgadget-socket-update/tls"]

[dependencies]
log.workspace = true
serde.workspace = true
simple_logger.workspace = true
summit-usbgadget-config.workspace = true
summit-usbgadget-dfu = { workspace = true, optional = true }
summit-usbgadget-fastboot-tcp = { workspace = true, optional = true }
summit-usbgadget-fastboot-usb = { workspace = true, optional = true }
summit-usbgadget-socket-update = { workspace = true, optional = true }
summit-usbgadget-swupdate = { workspace = true, optional = true }
summit-usbgadget-usb = { workspace = true, optional = true }
tokio.workspace = true
toml.workspace = true

[build-dependencies]
toml.workspace = true

[lints]
workspace = true

[profile.dev]
incremental = true

[profile.test]
incremental = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
