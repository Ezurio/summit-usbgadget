[package]
name = "swupdate-ipc"
version.workspace = true
edition.workspace = true
description = "Pure-Rust client for the SWUpdate IPC and progress protocols"
authors.workspace = true
license = "Ezurio-Clause"

[features]
# Async (tokio) client API. The blocking (std) API is always available.
async = ["dep:tokio", "dep:futures-util"]

[dependencies]
futures-util = { workspace = true, optional = true }
thiserror = "2"
tokio = { workspace = true, optional = true }

[lib]
crate-type = ["rlib"]
